[package]
name = "ghost-agent"
version = "0.1.0"
edition = "2021"
authors = ["Ghost Layer Technologies <keerthivahananbkv@gmail.com>"]
description = "Ghost IT eBPF Agent — Autonomous Digital Immune System"
license = "PROPRIETARY"

[[bin]]
name = "ghost-agent"
path = "src/main.rs"

[dependencies]
# Async runtime
tokio = { version = "1", features = ["full"] }

# eBPF userspace
libbpf-rs = "0.24"
libbpf-sys = "1.4"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# gRPC (C7)
tonic = "0.12"
prost = "0.13"

# Error handling
anyhow = "1"
thiserror = "1"

# Time
chrono = { version = "0.4", features = ["serde"] }

# Crypto (C11)
ed25519-dalek = "2"
sha2 = "0.10"
hmac = "0.12"

# System
nix = { version = "0.29", features = ["process", "signal", "user"] }
libc = "0.2"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true

[profile.release.build-override]
opt-level = 3
