name: Ghost IT Agent Release
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-22.04
    container:
      image: rust:alpine
    permissions:
      id-token: write
      contents: write
    outputs:
      hash: ${{ steps.hash.outputs.hash }}
    steps:
      - name: Install build dependencies (native Alpine/musl packages)
        run: apk add --no-cache git bash elfutils-dev libbpf-dev linux-headers musl-dev pkgconf
      - name: Checkout
        uses: actions/checkout@v4
      - name: Build agent binary
        run: |
          cargo build --release --manifest-path agent/rust/Cargo.toml
          cp agent/rust/target/release/ghost-agent \
            ./ghostit-agent-linux-amd64
      - name: Compute SHA-256
        id: hash
        run: |
          echo "hash=$(sha256sum ghostit-agent-linux-amd64 | base64 -w0)" \
            >> $GITHUB_OUTPUT
      - name: Install cosign
        uses: sigstore/cosign-installer@v3
      - name: Sign binary
        run: |
          cosign sign-blob \
            --bundle ghostit-agent-linux-amd64.cosign.bundle \
            --yes \
            ghostit-agent-linux-amd64
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ghostit-agent
          path: |
            ghostit-agent-linux-amd64
            ghostit-agent-linux-amd64.cosign.bundle
  provenance:
    needs: build
    permissions:
      id-token: write
      contents: write
      actions: read
    uses: slsa-framework/slsa-github-generator/.github/workflows/generator_generic_slsa3.yml@v2.0.0
    with:
      base64-subjects: "${{ needs.build.outputs.hash }}"
      upload-assets: true
