name: Ghost IT Agent Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    permissions:
      id-token: write
      contents: write
    outputs:
      hash: ${{ steps.hash.outputs.hash }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl

      - name: Install musl tools
        run: sudo apt-get install -y musl-tools

      - name: Build agent binary
        run: |
          cargo build --release --target x86_64-unknown-linux-musl \
            --manifest-path agent/rust/Cargo.toml
          cp agent/rust/target/x86_64-unknown-linux-musl/release/ghost-agent \
            ./ghostit-agent-linux-amd64

      - name: Compute SHA-256
        id: hash
        run: |
          echo "hash=$(sha256sum ghostit-agent-linux-amd64 | base64 -w0)" \
            >> $GITHUB_OUTPUT

      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      - name: Sign binary
        run: |
          cosign sign-blob \
            --bundle ghostit-agent-linux-amd64.cosign.bundle \
            --yes \
            ghostit-agent-linux-amd64

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ghostit-agent
          path: |
            ghostit-agent-linux-amd64
            ghostit-agent-linux-amd64.cosign.bundle

  provenance:
    needs: build
    permissions:
      id-token: write
      contents: write
      actions: read
    uses: slsa-framework/slsa-github-generator/.github/workflows/generator_generic_slsa3.yml@v2.0.0
    with:
      base64-subjects: "${{ needs.build.outputs.hash }}"
      upload-assets: true
