[package]
name = "pqcrypto"
version = "0.1.0"
edition = "2021"
description = "GhostIT C11 - Post-Quantum Communications (ML-KEM-768 + X25519 Hybrid KEM)"

[dependencies]
# Post-quantum crypto - ML-KEM-768 (CRYSTALS-Kyber)
oqs = { version = "0.9", features = ["kems"] }

# Classical crypto - X25519 key exchange
x25519-dalek = { version = "2", features = ["static_secrets"] }

# Key derivation - HKDF-SHA-256
hkdf = "0.12"
sha2 = "0.10"

# Symmetric encryption - AES-256-GCM session key
aes-gcm = "0.10"

# Random number generation
rand = "0.8"
rand_core = { version = "0.6", features = ["getrandom"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Error handling
thiserror = "1"

# Hex encoding for key display
hex = "0.4"

[dependencies.pyo3]
version = "0.21"
features = ["extension-module"]

[lib]
name = "pqcrypto"
path = "src/lib.rs"
crate-type = ["cdylib", "rlib"]
